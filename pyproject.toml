[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
exclude = [
  "^tests/",
  "^alembic/",
]

[[tool.mypy.overrides]]
module = [
  "jose.*",
  "passlib.*",
  "redis.*",
  "sqlalchemy.*",
  "alembic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.crud.*",
  "app.models.*",
  "app.services.execution",
  "app.services.trade_closer",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "app.core.settings",
  "app.core.security",
]
disable_error_code = ["call-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = [
  "app.api.routes.*",
]
disable_error_code = ["arg-type"]
